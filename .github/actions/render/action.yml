name: Render README
description: >-
  Fetch current weather, patch the profile README, write the job summary, and hand the README to the
  publish job as an artifact. Needs no secrets. Load it with `uses: $/.github/actions/render`
  (self-repository syntax: the exact running commit, no checkout needed).

inputs:
  profile-repo:
    description: Repository whose README.md is patched (public; read anonymously).
    required: true
  dry-run:
    description: "'true' on pull requests: label the summary, nothing is published."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check out repository (src only)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: src

    - name: Check out profile README (public, read-only)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.profile-repo }}
        ref: main
        path: profile
        persist-credentials: false
        sparse-checkout: /README.md
        sparse-checkout-cone-mode: false

    - name: Install toolchain (Bun via mise)
      uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        install_args: bun

    - name: Restore Bun package cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install runtime dependencies (frozen lockfile)
      shell: bash
      run: bun install --frozen-lockfile --production

    # Times out and retries transient Open-Meteo failures internally; writes the weather card
    # (src/summary.ts) to the job summary. Non-zero exit = this runner could not get the weather.
    - name: Fetch weather and patch README
      shell: bash
      run: bun start
      env:
        PROFILE_README_PATH: profile/README.md

    - name: Attach the README diff to the summary
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        {
          if [[ "$DRY_RUN" == true ]]; then
            echo '> [!NOTE]'
            echo '> Dry run: pull requests render against the live API but never publish.'
            echo
          fi
          echo '<details><summary>README diff</summary>'
          echo
          echo '```diff'
          git -C profile diff --unified=0 -- README.md
          echo '```'
          echo
          echo '</details>'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Hand the README to publish
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: profile-readme
        path: profile/README.md
        if-no-files-found: error
        retention-days: 1
