<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 312" width="912" height="312" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Profile Weather View architecture</title>
  <desc id="architecture-desc">A GitHub cron triggers weather.yml, which runs bun start. fetchWithRetry calls the Open-Meteo API with a 15 second timeout and up to four jittered attempts. The JSON response is validated and transformed by a Zod schema into a Weather value, rendered into the README section by the pure renderReadme core, written by the updateReadme shell, and pushed as an SSH-signed commit to the profile repository.</desc>
  <defs><style>
  .paper{fill:#f5f5f5}.paper2{fill:#ececec}.card{fill:#ffffff}
  .ink{fill:#2d3142}.muted{fill:#4f5d75}.soft{fill:#5a6580}.accent{fill:#bf4520}.link{fill:#2e5aa8}
  .s-ink{stroke:#2d3142}.s-muted{stroke:#4f5d75}.s-rule{stroke:#bfc0c0}.s-accent{stroke:#bf4520}.s-link{stroke:#2e5aa8}
  .tint{fill:#bf4520;fill-opacity:.08}.dot{fill:#2d3142;fill-opacity:.07}
  .sans{font-family:Geist,'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
  .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}
  @media (prefers-color-scheme: dark){
    .paper{fill:#2d3142}.paper2{fill:#393e53}.card{fill:#353a4e}
    .ink{fill:#f5f5f5}.muted{fill:#bfc0c0}.soft{fill:#949eb2}.accent{fill:#f08a59}.link{fill:#739fdf}
    .s-ink{stroke:#f5f5f5}.s-muted{stroke:#bfc0c0}.s-rule{stroke:rgba(191,192,192,.25)}.s-accent{stroke:#f08a59}.s-link{stroke:#739fdf}
    .tint{fill:#f08a59;fill-opacity:.12}.dot{fill:#f5f5f5;fill-opacity:.06}
    .m-muted path{fill:#bfc0c0}.m-accent path{fill:#f08a59}.m-link path{fill:#739fdf}
  }</style>
  <marker id="arrow" class="m-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" class="m-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#bf4520"/></marker>
  <marker id="arrow-link" class="m-link" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e5aa8"/></marker>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" class="dot"/></pattern></defs>
  <rect width="912" height="312" class="paper"/>
  <rect width="912" height="312" fill="url(#dots)"/>
<path d="M200,100 H262" fill="none" class="s-muted" stroke-width="1.25"  marker-end="url(#arrow)"/>
  <path d="M424,100 H486" fill="none" class="s-muted" stroke-width="1.25"  marker-end="url(#arrow)"/>
  <path d="M648,100 H710" fill="none" class="s-link" stroke-width="1.25"  marker-end="url(#arrow-link)"/>
  <path d="M792,128 V214" fill="none" class="s-link" stroke-width="1.25"  marker-end="url(#arrow-link)"/>
  <path d="M712,244 L650,244" fill="none" class="s-muted" stroke-width="1.25"  marker-end="url(#arrow)"/>
  <path d="M488,244 L426,244" fill="none" class="s-muted" stroke-width="1.25"  marker-end="url(#arrow)"/>
  <path d="M264,244 L202,244" fill="none" class="s-accent" stroke-width="1.75"  marker-end="url(#arrow-accent)"/>
  <path d="M708,116 L652,116" fill="none" class="s-link" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
  <rect x="206" y="77" width="52" height="14" class="paper"/>
  <text x="232" y="87" text-anchor="middle" class="mono muted" font-size="8.5" letter-spacing="0.6">TRIGGER</text>
  <rect x="648" y="77" width="64" height="14" class="paper"/>
  <text x="680" y="87" text-anchor="middle" class="mono link" font-size="8.5" letter-spacing="0.6">HTTPS GET</text>
  <rect x="660" y="127" width="40" height="14" class="paper"/>
  <text x="680" y="137" text-anchor="middle" class="mono link" font-size="8.5" letter-spacing="0.6">RETRY</text>
  <rect x="808" y="165" width="36" height="14" class="paper"/>
  <text x="826" y="175" text-anchor="middle" class="mono link" font-size="8.5" letter-spacing="0.6">JSON</text>
  <rect x="654" y="221" width="52" height="14" class="paper"/>
  <text x="680" y="231" text-anchor="middle" class="mono muted" font-size="8.5" letter-spacing="0.6">WEATHER</text>
  <rect x="428" y="221" width="56" height="14" class="paper"/>
  <text x="456" y="231" text-anchor="middle" class="mono muted" font-size="8.5" letter-spacing="0.6">MARKDOWN</text>
  <rect x="208" y="221" width="48" height="14" class="paper"/>
  <text x="232" y="231" text-anchor="middle" class="mono accent" font-size="8.5" letter-spacing="0.6">COMMIT</text>
  
  <g>
    <rect x="40" y="72" width="160" height="56" rx="6" class="paper"/>
    <rect x="40" y="72" width="160" height="56" rx="6" class="paper s-muted" stroke-width="1"/>
    <rect x="50" y="65" width="56.8" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="56" y="75" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">SCHEDULE</text>
    <text x="120" y="101" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">GitHub cron</text>
    <text x="120" y="118" text-anchor="middle" class="mono soft" font-size="10">23 5,13,21 * * *</text>
  </g>
  
  <g>
    <rect x="264" y="72" width="160" height="56" rx="6" class="paper"/>
    <rect x="264" y="72" width="160" height="56" rx="6" class="card s-ink" stroke-width="1"/>
    <rect x="274" y="65" width="56.8" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="280" y="75" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">WORKFLOW</text>
    <text x="344" y="101" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">weather.yml</text>
    <text x="344" y="118" text-anchor="middle" class="mono soft" font-size="10">bun start</text>
  </g>
  
  <g>
    <rect x="488" y="72" width="160" height="56" rx="6" class="paper"/>
    <rect x="488" y="72" width="160" height="56" rx="6" class="card s-ink" stroke-width="1"/>
    <rect x="498" y="65" width="62.4" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="504" y="75" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">HTTP SEAM</text>
    <text x="568" y="101" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">fetchWithRetry</text>
    <text x="568" y="118" text-anchor="middle" class="mono soft" font-size="10">15s × 4, jitter</text>
  </g>
  
  <g>
    <rect x="712" y="72" width="160" height="56" rx="6" class="paper"/>
    <rect x="712" y="72" width="160" height="56" rx="6" class="paper s-muted" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="722" y="65" width="56.8" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="728" y="75" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">EXTERNAL</text>
    <text x="792" y="101" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">Open-Meteo</text>
    <text x="792" y="118" text-anchor="middle" class="mono soft" font-size="10">api.open-meteo.com</text>
  </g>
  
  <g>
    <rect x="40" y="216" width="160" height="56" rx="6" class="paper"/>
    <rect x="40" y="216" width="160" height="56" rx="6" class="paper2 s-ink" stroke-width="1"/>
    <rect x="50" y="209" width="79.19999999999999" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="56" y="219" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">PROFILE REPO</text>
    <text x="120" y="245" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">README.md</text>
    <text x="120" y="262" text-anchor="middle" class="mono soft" font-size="10">SSH-signed push</text>
  </g>
  
  <g>
    <rect x="264" y="216" width="160" height="56" rx="6" class="paper"/>
    <rect x="264" y="216" width="160" height="56" rx="6" class="card s-ink" stroke-width="1"/>
    <rect x="274" y="209" width="62.4" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="280" y="219" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">I/O SHELL</text>
    <text x="344" y="245" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">updateReadme</text>
    <text x="344" y="262" text-anchor="middle" class="mono soft" font-size="10">Bun.write</text>
  </g>
  
  <g>
    <rect x="488" y="216" width="160" height="56" rx="6" class="paper"/>
    <rect x="488" y="216" width="160" height="56" rx="6" class="tint s-accent" stroke-width="1.5"/>
    <rect x="498" y="209" width="62.4" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="504" y="219" class="mono accent" font-size="8" font-weight="500" letter-spacing="1.4">PURE CORE</text>
    <text x="568" y="245" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">renderReadme</text>
    <text x="568" y="262" text-anchor="middle" class="mono soft" font-size="10">section + stamp</text>
  </g>
  
  <g>
    <rect x="712" y="216" width="160" height="56" rx="6" class="paper"/>
    <rect x="712" y="216" width="160" height="56" rx="6" class="card s-ink" stroke-width="1"/>
    <rect x="722" y="209" width="45.599999999999994" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="728" y="219" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">SCHEMA</text>
    <text x="792" y="245" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">Zod transform</text>
    <text x="792" y="262" text-anchor="middle" class="mono soft" font-size="10">JSON → Weather</text>
  </g>
  <text x="40" y="36" class="mono soft" font-size="9" letter-spacing="1.6">ONE SCHEDULED RUN · ≈1 S END TO END · EXIT 1 ON ANY FAILURE</text>
</svg>
