<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Profile Weather View</title>
  <desc id="cover-desc">Live weather, patched into your profile README three times a day. A preview card shows the rendered weather table: Clear Sky, 25 degrees Celsius, sunrise 06:14, sunset 17:12, humidity 60 percent.</desc>
  <defs><style>
  .paper{fill:#f5f5f5}.paper2{fill:#ececec}.card{fill:#ffffff}
  .ink{fill:#2d3142}.muted{fill:#4f5d75}.soft{fill:#5a6580}.accent{fill:#bf4520}.link{fill:#2e5aa8}
  .s-ink{stroke:#2d3142}.s-muted{stroke:#4f5d75}.s-rule{stroke:#bfc0c0}.s-accent{stroke:#bf4520}.s-link{stroke:#2e5aa8}
  .tint{fill:#bf4520;fill-opacity:.08}.dot{fill:#2d3142;fill-opacity:.07}
  .sans{font-family:Geist,'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
  .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}
  @media (prefers-color-scheme: dark){
    .paper{fill:#2d3142}.paper2{fill:#393e53}.card{fill:#353a4e}
    .ink{fill:#f5f5f5}.muted{fill:#bfc0c0}.soft{fill:#949eb2}.accent{fill:#f08a59}.link{fill:#739fdf}
    .s-ink{stroke:#f5f5f5}.s-muted{stroke:#bfc0c0}.s-rule{stroke:rgba(191,192,192,.25)}.s-accent{stroke:#f08a59}.s-link{stroke:#739fdf}
    .tint{fill:#f08a59;fill-opacity:.12}.dot{fill:#f5f5f5;fill-opacity:.06}
    .m-muted path{fill:#bfc0c0}.m-accent path{fill:#f08a59}.m-link path{fill:#739fdf}
  }</style>
  <marker id="arrow" class="m-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" class="m-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#bf4520"/></marker>
  <marker id="arrow-link" class="m-link" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e5aa8"/></marker>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" class="dot"/></pattern></defs>
  <rect width="1280" height="400" class="paper"/>
  <rect width="1280" height="400" fill="url(#dots)"/>

  <text x="72" y="120" class="mono soft" font-size="12" letter-spacing="2.4">GITHUB PROFILE · OPEN-METEO · 3× DAILY</text>
  <text x="68" y="196" class="serif ink" font-size="60">Profile Weather View</text>
  <text x="72" y="244" class="sans muted" font-size="22">Live weather, patched into your profile README.</text>
  <text x="72" y="300" class="mono soft" font-size="14">$ bun start  <tspan class="accent">→</tspan>  fetch · validate · render · signed push</text>

  <rect x="704" y="104" width="520" height="192" rx="8" class="card s-rule" stroke-width="1"/>
  <text x="728" y="140" class="mono soft" font-size="10" letter-spacing="1.6">&lt;!-- HOURLY WEATHER UPDATE --&gt;</text>
  <text x="728" y="180" class="mono soft" font-size="10" letter-spacing="1.4">WEATHER</text>
  <text x="896" y="180" class="mono soft" font-size="10" letter-spacing="1.4">TEMP</text>
  <text x="980" y="180" class="mono soft" font-size="10" letter-spacing="1.4">SUNRISE</text>
  <text x="1072" y="180" class="mono soft" font-size="10" letter-spacing="1.4">SUNSET</text>
  <text x="1160" y="180" class="mono soft" font-size="10" letter-spacing="1.4">HUMIDITY</text>
  <line x1="728" y1="194" x2="1200" y2="194" class="s-rule" stroke-width="1"/>
  <circle cx="738" cy="228" r="8" fill="none" class="s-accent" stroke-width="2"/><line x1="751.0" y1="228.0" x2="757.0" y2="228.0" class="s-accent" stroke-width="2" stroke-linecap="round"/><line x1="747.2" y1="237.2" x2="751.4" y2="241.4" class="s-accent" stroke-width="2" stroke-linecap="round"/><line x1="738.0" y1="241.0" x2="738.0" y2="247.0" class="s-accent" stroke-width="2" stroke-linecap="round"/><line x1="728.8" y1="237.2" x2="724.6" y2="241.4" class="s-accent" stroke-width="2" stroke-linecap="round"/><line x1="725.0" y1="228.0" x2="719.0" y2="228.0" class="s-accent" stroke-width="2" stroke-linecap="round"/><line x1="728.8" y1="218.8" x2="724.6" y2="214.6" class="s-accent" stroke-width="2" stroke-linecap="round"/><line x1="738.0" y1="215.0" x2="738.0" y2="209.0" class="s-accent" stroke-width="2" stroke-linecap="round"/><line x1="747.2" y1="218.8" x2="751.4" y2="214.6" class="s-accent" stroke-width="2" stroke-linecap="round"/>
  <text x="768" y="234" class="sans ink" font-size="17" font-weight="600">Clear Sky</text>
  <text x="896" y="234" class="sans ink" font-size="18" font-weight="600">25°C</text>
  <text x="980" y="234" class="sans ink" font-size="18" font-weight="600">06:14</text>
  <text x="1072" y="234" class="sans ink" font-size="18" font-weight="600">17:12</text>
  <text x="1160" y="234" class="sans ink" font-size="18" font-weight="600">60%</text>
  <text x="728" y="272" class="sans soft" font-size="12" font-style="italic">Last refresh: Tuesday, November 17, 2026 at 11:23:05 (UTC+6)</text>
  <text x="1224" y="324" text-anchor="end" class="mono soft" font-size="10" letter-spacing="1.4">DHAKA · 23.88°N 90.38°E</text>
</svg>
