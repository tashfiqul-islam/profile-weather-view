<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 260" width="1072" height="260" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Delivery pipeline</title>
  <desc id="pipeline-desc">A conventional commit passes hk pre-commit hooks (oxlint, oxfmt, tsc), is pushed, and must pass bun run check in CI with 100 percent coverage. Renovate pull requests enter at the same gate. On main, a green run releases: badges are synced and semantic-release tags a version and writes the changelog.</desc>
  <defs><style>
  .paper{fill:#f5f5f5}.paper2{fill:#ececec}.card{fill:#ffffff}
  .ink{fill:#2d3142}.muted{fill:#4f5d75}.soft{fill:#5a6580}.accent{fill:#bf4520}.link{fill:#2e5aa8}
  .s-ink{stroke:#2d3142}.s-muted{stroke:#4f5d75}.s-rule{stroke:#bfc0c0}.s-accent{stroke:#bf4520}.s-link{stroke:#2e5aa8}
  .tint{fill:#bf4520;fill-opacity:.08}.dot{fill:#2d3142;fill-opacity:.07}
  .sans{font-family:Geist,'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
  .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}
  @media (prefers-color-scheme: dark){
    .paper{fill:#2d3142}.paper2{fill:#393e53}.card{fill:#353a4e}
    .ink{fill:#f5f5f5}.muted{fill:#bfc0c0}.soft{fill:#949eb2}.accent{fill:#f08a59}.link{fill:#739fdf}
    .s-ink{stroke:#f5f5f5}.s-muted{stroke:#bfc0c0}.s-rule{stroke:rgba(191,192,192,.25)}.s-accent{stroke:#f08a59}.s-link{stroke:#739fdf}
    .tint{fill:#f08a59;fill-opacity:.12}.dot{fill:#f5f5f5;fill-opacity:.06}
    .m-muted path{fill:#bfc0c0}.m-accent path{fill:#f08a59}.m-link path{fill:#739fdf}
  }</style>
  <marker id="arrow" class="m-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" class="m-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#bf4520"/></marker>
  <marker id="arrow-link" class="m-link" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e5aa8"/></marker>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" class="dot"/></pattern></defs>
  <rect width="1072" height="260" class="paper"/>
  <rect width="1072" height="260" fill="url(#dots)"/>
<path d="M192,156 H246" fill="none" class="s-muted" stroke-width="1.25"  marker-end="url(#arrow)"/>
  <path d="M400,156 H454" fill="none" class="s-muted" stroke-width="1.25"  marker-end="url(#arrow)"/>
  <path d="M608,156 H662" fill="none" class="s-accent" stroke-width="1.75"  marker-end="url(#arrow-accent)"/>
  <path d="M816,156 H870" fill="none" class="s-muted" stroke-width="1.25"  marker-end="url(#arrow)"/>
  <path d="M576,72 L576,126" fill="none" class="s-muted" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="410" y="133" width="36" height="14" class="paper"/>
  <text x="428" y="143" text-anchor="middle" class="mono muted" font-size="8.5" letter-spacing="0.6">PUSH</text>
  <rect x="616" y="133" width="40" height="14" class="paper"/>
  <text x="636" y="143" text-anchor="middle" class="mono accent" font-size="8.5" letter-spacing="0.6">GREEN</text>
  <rect x="820" y="133" width="48" height="14" class="paper"/>
  <text x="844" y="143" text-anchor="middle" class="mono muted" font-size="8.5" letter-spacing="0.6">SEMVER</text>
  <rect x="500" y="93" width="64" height="14" class="paper"/>
  <text x="532" y="103" text-anchor="middle" class="mono muted" font-size="8.5" letter-spacing="0.6">AUTOMERGE</text>
  
  <g>
    <rect x="40" y="128" width="152" height="56" rx="6" class="paper"/>
    <rect x="40" y="128" width="152" height="56" rx="6" class="paper s-muted" stroke-width="1"/>
    <rect x="50" y="121" width="40" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="56" y="131" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">LOCAL</text>
    <text x="116" y="157" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">git commit</text>
    <text x="116" y="174" text-anchor="middle" class="mono soft" font-size="10">conventional</text>
  </g>
  
  <g>
    <rect x="248" y="128" width="152" height="56" rx="6" class="paper"/>
    <rect x="248" y="128" width="152" height="56" rx="6" class="card s-ink" stroke-width="1"/>
    <rect x="258" y="121" width="56.8" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="264" y="131" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">HK HOOKS</text>
    <text x="324" y="157" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">pre-commit</text>
    <text x="324" y="174" text-anchor="middle" class="mono soft" font-size="10">oxlint · oxfmt · tsc</text>
  </g>
  
  <g>
    <rect x="456" y="128" width="152" height="56" rx="6" class="paper"/>
    <rect x="456" y="128" width="152" height="56" rx="6" class="tint s-accent" stroke-width="1.5"/>
    <rect x="466" y="121" width="84.8" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="472" y="131" class="mono accent" font-size="8" font-weight="500" letter-spacing="1.4">CI · THE GATE</text>
    <text x="532" y="157" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">bun run check</text>
    <text x="532" y="174" text-anchor="middle" class="mono soft" font-size="10">100% coverage</text>
  </g>
  
  <g>
    <rect x="664" y="128" width="152" height="56" rx="6" class="paper"/>
    <rect x="664" y="128" width="152" height="56" rx="6" class="card s-ink" stroke-width="1"/>
    <rect x="674" y="121" width="62.4" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="680" y="131" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">MAIN ONLY</text>
    <text x="740" y="157" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">Release</text>
    <text x="740" y="174" text-anchor="middle" class="mono soft" font-size="10">sync-badges</text>
  </g>
  
  <g>
    <rect x="872" y="128" width="152" height="56" rx="6" class="paper"/>
    <rect x="872" y="128" width="152" height="56" rx="6" class="paper2 s-ink" stroke-width="1"/>
    <rect x="882" y="121" width="56.8" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="888" y="131" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">ARTIFACT</text>
    <text x="948" y="157" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">vX.Y.Z</text>
    <text x="948" y="174" text-anchor="middle" class="mono soft" font-size="10">tag · CHANGELOG</text>
  </g>
  
  <g>
    <rect x="456" y="24" width="152" height="48" rx="6" class="paper"/>
    <rect x="456" y="24" width="152" height="48" rx="6" class="paper s-muted" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="466" y="17" width="28.799999999999997" height="14" rx="2" class="paper s-rule" stroke-width="1"/>
    <text x="472" y="27" class="mono soft" font-size="8" font-weight="500" letter-spacing="1.4">BOT</text>
    <text x="532" y="49" text-anchor="middle" class="sans ink" font-size="14" font-weight="600">Renovate PR</text>
    <text x="532" y="66" text-anchor="middle" class="mono soft" font-size="10">deps · actions · mise</text>
  </g>
  <text x="40" y="236" class="mono soft" font-size="9" letter-spacing="1.6">EVERY PATH TO MAIN CROSSES THE SAME GATE: TYPES · TYPE-AWARE LINT · FORMAT · TESTS</text>
</svg>
