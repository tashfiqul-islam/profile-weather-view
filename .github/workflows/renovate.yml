name: Renovate config

on:
  pull_request:
    paths: [renovate.json]
  push:
    branches: [main]
    paths: [renovate.json]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate renovate.json
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out this repo
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain (Bun, Node via mise)
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: bun node

      - name: Validate config (strict)
        run: bunx --package renovate@44.239.1 renovate-config-validator --strict
