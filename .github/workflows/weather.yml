name: Weather

on:
  schedule:
    - cron: '23 5,13,21 * * *' # 11:23, 19:23, 03:23 Asia/Dhaka
  workflow_dispatch:
  # Dry run on PRs: render against the live API and the real profile README, never publish.
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - 'mise.toml'
      - '.github/workflows/weather.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

env:
  PROFILE_REPO: tashfiqul-islam/tashfiqul-islam

jobs:
  # No secrets here: this job talks to the internet and runs dependency code.
  render:
    name: ${{ github.event_name == 'pull_request' && 'Render README (dry run)' || 'Render README' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out this repo
    steps:
      - name: Check out repository (src only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src

      - name: Check out profile README (public, read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROFILE_REPO }}
          ref: main
          path: profile
          persist-credentials: false
          sparse-checkout: /README.md
          sparse-checkout-cone-mode: false

      - name: Install toolchain (Bun via mise)
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: bun

      - name: Restore Bun package cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install runtime dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --production

      # Times out and retries transient Open-Meteo failures internally; non-zero exit = real failure.
      # Writes the weather card (src/summary.ts) to the job summary.
      - name: Fetch weather and patch README
        run: bun start
        env:
          PROFILE_README_PATH: profile/README.md

      - name: Attach the README diff to the summary
        env:
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
        run: |
          {
            if [[ "$DRY_RUN" == true ]]; then
              echo '> [!NOTE]'
              echo '> Dry run: pull requests render against the live API but never publish.'
              echo
            fi
            echo '<details><summary>README diff</summary>'
            echo
            echo '```diff'
            git -C profile diff --unified=0 -- README.md
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the README to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-readme
          path: profile/README.md
          if-no-files-found: error
          retention-days: 1

  # Secrets live only here, behind the `profile` environment; no network fetch, no dependency code.
  publish:
    name: Publish signed commit
    needs: render
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: profile
    permissions: {} # pushes with the PAT, not GITHUB_TOKEN
    steps:
      # Only the reviewed publish script from this repo: no dependencies, no toolchain.
      - name: Check out publish script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /scripts/publish.sh
          sparse-checkout-cone-mode: false

      # Public repo: no token needed to read it. The PAT appears only in the push step below.
      - name: Check out profile repository (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROFILE_REPO }}
          ref: main
          path: profile
          persist-credentials: false

      - name: Take the rendered README from render
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-readme
          path: profile

      # scripts/publish.sh: guard (README.md only, weather section only) → SSH-sign → rebase →
      # verify-commit → push. Tested end to end in scripts/publish.test.ts.
      - name: Guard, sign, verify, and push the commit
        id: publish
        working-directory: profile
        env:
          PAT: ${{ secrets.PAT }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          NAME: ${{ vars.GIT_COMMITTER_NAME }}
          EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
        run: |
          [[ -n "$PAT" ]] || { echo "::error::PAT is not set in the profile environment"; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/publish.sh" \
            "https://x-access-token:${PAT}@github.com/${PROFILE_REPO}.git"

      # No secrets here: renders publish.sh's step outputs (result, commit, message) as a table.
      - name: Summarise the publish
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.publish.outcome }}
          RESULT: ${{ steps.publish.outputs.result }}
          COMMIT: ${{ steps.publish.outputs.commit }}
          MESSAGE: ${{ steps.publish.outputs.message }}
        run: |
          # shellcheck disable=SC2016 # backticks inside single quotes are Markdown code spans
          {
            echo '### Publish'
            echo
            echo '| Check | Result |'
            echo '| :---- | :----- |'
            case "$OUTCOME/$RESULT" in
              success/published)
                echo '| Guard | ✅ `README.md` only, weather section and stamp only |'
                echo '| Signature | ✅ SSH-signed, `git verify-commit` passed before push |'
                echo "| Commit | ✅ [\`${COMMIT:0:7}\`](https://github.com/${PROFILE_REPO}/commit/${COMMIT}) ${MESSAGE} |"
                ;;
              success/unchanged)
                echo '| Commit | ➖ README unchanged, nothing to publish |'
                ;;
              *)
                echo "| Publish | ❌ ${OUTCOME:-skipped}: see the **Guard, sign, verify, and push the commit** log |"
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
