telemetry = false

[install]
exact = true
linker = "isolated" # phantom deps fail loudly
minimumReleaseAge = 259200 # 3 days: supply-chain buffer
minimumReleaseAgeExcludes = ["@types/bun", "typescript"]

[test]
pathIgnorePatterns = ["node_modules/**", "CHANGELOG.md"]
randomize = true
coverage = true
coverageSkipTestFiles = true
coverageThreshold = { line = 1.0, function = 1.0, statement = 1.0 }
coveragePathIgnorePatterns = ["src/test-utils.ts"]
coverageReporter = ["text"]
