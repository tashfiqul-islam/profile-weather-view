# Lefthook Configuration
# https://lefthook.dev/configuration/

min_version: 2.0.13

no_tty: true

output:
  - execution_out
  - failure
  - summary
  - success
  - progress

skip_lfs: true

# ═══════════════════════════════════════════════════════════════════════════════
# Pre-commit: Fast parallel checks on staged files
# ═══════════════════════════════════════════════════════════════════════════════

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,jsx,json,jsonc,css,scss,md,mdx,toml,yml,yaml}'
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true

    - name: typecheck
      glob: '*.{ts,tsx}'
      run: bun run typecheck --incremental

# ═══════════════════════════════════════════════════════════════════════════════
# Commit message validation
# ═══════════════════════════════════════════════════════════════════════════════

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

# ═══════════════════════════════════════════════════════════════════════════════
# Pre-push: Full quality gate
# ═══════════════════════════════════════════════════════════════════════════════

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test

    - name: lint
      run: oxlint src/

# ═══════════════════════════════════════════════════════════════════════════════
# Post-merge: Auto-install deps when lockfile changes
# ═══════════════════════════════════════════════════════════════════════════════

post-merge:
  jobs:
    - name: install
      glob: '{bun.lock,bun.lockb,package.json}'
      run: bun install

# ═══════════════════════════════════════════════════════════════════════════════
# Post-checkout: Auto-install deps when switching branches
# ═══════════════════════════════════════════════════════════════════════════════

post-checkout:
  jobs:
    - name: install
      glob: '{bun.lock,bun.lockb,package.json}'
      run: bun install
