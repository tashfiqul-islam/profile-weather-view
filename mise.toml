# Single source of truth for tool versions: local dev, CI (jdx/mise-action) and Renovate.
[tools]
bun = "1.4.4"
node = "26.13.1" # semantic-release and the Renovate validator run on Node
hk = "2.12.0"
pkl = "0.33.0"
actionlint = "1.7.12" # workflow syntax, expressions, shellcheck
zizmor = "1.32.0" # workflow security audit
shellcheck = "0.11.0" # shell scripts in scripts/
lychee = "0.24.2" # Markdown link and anchor check
difftastic = "0.72.0" # structural diffs for local review (`mise run review`)

[tasks.setup]
description = "Install deps and git hooks"
run = ["bun install --frozen-lockfile", "hk install --mise"]

[tasks.lint-actions]
description = "Lint and audit GitHub Actions workflows and shell scripts"
run = ["actionlint", "zizmor --offline .github/workflows", "shellcheck scripts/publish.sh"]

[tasks.lint-docs]
shell = "bash -c"
description = "Check every relative link and #anchor in the Markdown docs (offline, deterministic)"
run = "lychee --offline --include-fragments --no-progress README.md AGENTS.md '.github/**/*.md'"

[tasks.review]
description = "Structural (syntax-aware) diff of this branch against main, via difftastic"
run = "git -c diff.external=difft diff --ext-diff main...HEAD"
